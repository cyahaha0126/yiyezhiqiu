:root {
  --bg: #fffde6;
  --surface: #ffffff;
  --fg: #2b2616;
  --ink: #3b2f10;
  --muted: #6e6650;
  --line: #efe3a8;
  --yolk: #fee78b;
  --yolk-deep: #f0c33c;
  --accent-text: #8a6200;
  --live: #1f8a4c;
  --live-soft: #def3e6;
  --soon: #a86a00;
  --soon-soft: #fbefd2;
  --done: #7c7766;
  --done-soft: #f0edde;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "Taipei Sans TC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  margin: 0; padding-block: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

/* ---- 主画面 ---- */
.home {
  position: relative; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
  min-height: 100vh;
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.banner { display: block; width: 100%; height: auto; }
.menu {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr; align-content: center; align-items: center;
  gap: clamp(32px, 8vh, 72px) 14px; width: min(100%, 420px); margin: 0 auto;
  padding: 40px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px));
}
.pill-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 64px;
  padding: 0 12px 0 8px; background: #fff; border: 3px solid var(--yolk); border-radius: 999px;
  font-family: var(--font-display); font-size: clamp(1rem, 4.8vw, 1.3rem); font-weight: 900; color: #000; cursor: pointer;
  letter-spacing: .03em; min-width: 0;
}
.pill-btn.wide { grid-column: 1 / -1; }
.pill-btn svg { width: 36px; height: 36px; flex: none; }
.pill-btn span { white-space: nowrap; }
@media (hover: hover) { .pill-btn:hover { background: var(--bg); border-color: var(--yolk-deep); } }
.pill-btn:active { background: var(--bg); }
@media (prefers-reduced-motion: no-preference) {
  .pill-btn { transition: background .15s, border-color .15s; }
  .pill-btn:active { transform: scale(.98); }
}

/* ---- 内页 ---- */
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 40px;
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg);
  display: flex; align-items: center; gap: 6px; padding-block: 10px 8px;
}
.moon-back { width: 52px; height: 52px; padding: 0; background: none; border: 0; border-radius: 50%; cursor: pointer; flex: none; }
.moon-back svg { width: 100%; height: 100%; display: block; }
.topbar h1 { margin: 0; min-width: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 6.4vw, 1.9rem); line-height: 1.2; letter-spacing: .02em; }

.lab { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; line-height: 1.3; }
.lab i { display: block; width: 7px; height: 22px; border-radius: 2px; background: var(--yolk); flex: none; }
.lab.r { justify-content: flex-end; }
.blk-l { width: min(64%, 320px); margin: 14px 0 0 clamp(0px, 9%, 48px); }
.blk-r { width: min(88%, 380px); margin: 0 0 0 auto; }
.shot, .info { background: #fff; border: 3px solid var(--yolk); }
.shot { border-radius: 26px; padding: 12px; }
.shot .pic { aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: var(--bg); display: grid; place-items: center; text-align: center; padding: 10px; max-width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .ph { color: var(--muted); font-size: .85rem; line-height: 1.5; }
.shot .ph strong { display: block; font-family: var(--font-display); color: var(--ink); font-size: 1rem; margin-bottom: 2px; }
.info { border-radius: 24px; padding: 14px 18px; }
.info .r { margin: 0; display: flex; gap: 10px; font-size: .95rem; line-height: 1.75; }
.info .r b { font-weight: 500; flex: none; }
.info .r span { min-width: 0; overflow-wrap: anywhere; }
.info .r-v { margin: 0; font-size: .95rem; line-height: 1.6; overflow-wrap: anywhere; }

.map-wrap { margin: 6px -4px 0; }
#cnmap { display: block; width: 100%; height: auto; max-width: 100%; }
#cnmap defs path { vector-effect: non-scaling-stroke; }
.m-out use { fill: #222; stroke: #222; stroke-width: 7px; stroke-linejoin: round; }
.m-fill use { fill: var(--bg); stroke: #6a6a6a; stroke-width: 1px; stroke-linejoin: round; }
.m-fill use.has { cursor: pointer; }
@media (hover: hover) { .m-fill use.has:hover { fill: #fff5bf; } .m-fill use.sel:hover { fill: #feea8d; } }
.m-fill use.sel { fill: #feea8d; stroke: #222; stroke-width: 1.6px; }
.hint { margin: 2px 0 26px; text-align: center; color: var(--muted); font-size: .85rem; min-height: 1.4em; }
#m-labels text { font-family: var(--font-body); font-size: 15px; font-weight: 400; fill: var(--muted); text-anchor: middle; dominant-baseline: central; pointer-events: none;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
#m-labels text.has { fill: #222; font-weight: 700; }
#m-labels text.sel { stroke: #feea8d; }
.lead2 { stroke: #8a8570; stroke-width: 1px; vector-effect: non-scaling-stroke; pointer-events: none; }
.anchor { fill: #8a8570; pointer-events: none; }
.hit { fill: transparent; cursor: pointer; outline: none; }
.hit:focus-visible { stroke: var(--accent-text); stroke-width: 2px; }
.sub { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin: 0 0 10px; }
.sub:empty { display: none; }
.sub button { font: inherit; font-size: .9rem; color: var(--ink); background: #fff; border: 2px solid var(--yolk); border-radius: 999px; padding: 3px 14px; cursor: pointer; }
.sub button[aria-pressed="true"] { background: #feea8d; border-color: var(--yolk-deep); font-weight: 700; }
.chars-end { display: block; width: 120px; max-width: 40%; height: auto; margin: 12px 0 0 auto; }

.pill { display: inline-block; font-size: .75rem; font-weight: 500; padding: 1px 9px; border-radius: 99px; white-space: nowrap; }
.pill.live { background: var(--live-soft); color: var(--live); }
.pill.soon { background: var(--soon-soft); color: var(--soon); }
.pill.done, .pill.tbd { background: var(--done-soft); color: var(--done); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
.filters input, .filters select {
  font: inherit; color: var(--fg); background: #fff; border: 2px solid var(--yolk);
  border-radius: 14px; padding: 8px 12px; min-width: 0;
}
.filters input { flex: 1 1 100%; }
.fld { flex: 1 1 140px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld span { font-size: .8rem; color: var(--muted); padding-left: 6px; }
.fld select { width: 100%; }
.count { color: var(--muted); font-size: .85rem; margin: 0 0 10px; }
.cards { display: grid; gap: 12px; }
.card { background: #fff; border: 3px solid var(--yolk); border-radius: 22px; padding: 14px 16px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card h3 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
.card h3 small { font-family: var(--font-body); font-weight: 500; font-size: .75rem; color: var(--accent-text); margin-right: 6px; }
.addr { color: var(--muted); font-size: .88rem; margin: 3px 0 10px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 14px; margin: 0 0 12px; }
.facts div { min-width: 0; }
.facts .wide { grid-column: 1 / -1; }
.facts dt { font-size: .75rem; color: var(--muted); }
.facts dd { margin: 0; font-size: .9rem; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: .85rem; color: var(--ink); background: #fff; border: 2px solid var(--yolk); border-radius: 999px; padding: 5px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
@media (hover: hover) { .btn:hover { border-color: var(--yolk-deep); } }
.btn.primary { background: var(--yolk); font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; background: #fff; border: 3px dashed var(--yolk); border-radius: 22px; }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
.notes{display:grid;gap:12px}
.note{background:#fff;border:3px solid var(--yolk);border-radius:22px;padding:14px 16px;min-width:0}
.note h3{margin:0 0 2px;font-family:var(--font-display);font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere}
.note time{display:block;font-size:.78rem;color:var(--muted);margin-bottom:8px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem;line-height:1.7}
.note a{color:var(--accent-text)}
.note .pin{display:inline-block;font-family:var(--font-body);font-size:.72rem;background:var(--yolk);color:var(--ink);border-radius:99px;padding:0 8px;margin-right:6px;vertical-align:middle}
.guide{background:#fff;border:3px solid var(--yolk);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.guide h2{margin:0 0 6px;font-family:var(--font-display);font-size:1.1rem}
.guide p{margin:0 0 10px;font-size:.92rem;line-height:1.7}
.guide h3{margin:12px 0 4px;font-size:.95rem;color:var(--accent-text)}
.guide ul{margin:0;padding-left:1.2em;font-size:.9rem;line-height:1.8;color:var(--ink)}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 14px;padding:14px 18px;border-radius:999px;background:var(--yolk);border:3px solid var(--yolk-deep);color:var(--ink);font-family:var(--font-display);font-size:1.1rem;text-decoration:none;text-align:center}
.go[aria-disabled="true"]{opacity:.55;pointer-events:none}
.stat{background:#fff8d6;border-radius:16px;padding:10px 14px;font-size:.9rem;margin:0}
.stat b{font-family:var(--font-display);font-size:1.15rem;color:var(--accent-text);margin:0 3px}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wall figure{margin:0;display:flex;flex-direction:column;background:#fff;border:3px solid var(--yolk);border-radius:20px;overflow:hidden;cursor:pointer;min-width:0}
.wall figure.todo{cursor:default;border-style:dashed}.wall .ph{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;background:var(--bg);color:#a89a5a;font-weight:700;font-size:15px;letter-spacing:2px}
.wall .box{position:relative}.wall .car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1;background:var(--bg)}.wall .car::-webkit-scrollbar{display:none}
.wall .sl{flex:0 0 100%;scroll-snap-align:center;position:relative;height:100%}.wall .sl img,.wall .sl video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.wall .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;padding-left:3px;pointer-events:none}
.lightbox .m{display:contents}.lightbox video{max-width:100%;max-height:78vh;border-radius:12px;background:#000}
.wall .dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}.wall .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 2px rgba(0,0,0,.4)}.wall .dots i.on{background:var(--yolk);width:14px;border-radius:3px}
.wall .cnt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;pointer-events:none}
.lightbox .nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:34px;border-radius:12px;padding:0}.lightbox .prev{left:8px;right:auto}.lightbox .next{right:8px;left:auto}
.wall figcaption .nk,.wall figcaption .sy{display:block;font-size:12px;line-height:1.4;color:#8a7d3c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wall figcaption .sy{min-height:1.4em;color:#6b6330}
.wall img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg)}
.wall figcaption{padding:8px 10px 10px;font-size:.85rem;line-height:1.4;color:var(--ink);overflow-wrap:anywhere;min-height:calc(1.4em + 2 * 12px * 1.4 + 18px)}
.wall figcaption b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{display:block;margin:12px auto 0;font:inherit;background:#fff;border:2px solid var(--yolk);border-radius:999px;padding:6px 22px;cursor:pointer;color:var(--ink)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(30,25,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px;object-fit:contain}
.lightbox p{color:#fff;margin:0;text-align:center;font-size:.9rem;max-width:520px;overflow-wrap:anywhere}
.lightbox button{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:14px;font:inherit;background:#fff;border:0;border-radius:99px;padding:6px 16px;cursor:pointer}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(#d2c0a1 50%,#b09e85 50%);display:grid;place-items:center;cursor:pointer;border:0;padding:0;width:100%;transition:opacity .5s ease}
.splash.out{opacity:0;pointer-events:none}
.splash img{width:100%;height:100%;object-fit:contain;display:block}
.splash span{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(255,253,230,.92);color:#5a4a38;border-radius:999px;padding:6px 20px;font-family:var(--font-display);font-size:1rem;letter-spacing:.08em;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.splash{transition:none}.splash span{animation:none}}


.shot .pic.has{padding:0;position:relative;cursor:zoom-in;background:#fff8d6;overflow:hidden}
.shot .pic.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .pic.has::after{content:"点击放大";position:absolute;right:8px;bottom:8px;background:rgba(43,38,22,.62);color:#fff;font-size:.72rem;line-height:1;padding:5px 9px;border-radius:99px;pointer-events:none}
</style>
</head>

<script>
// 大屏现场照片已改为放在仓库的 screens 文件夹，由 settings.js 里的 SHOTS 指定。这里留空是为了兼容旧写法。
var PHOTOS = {};
</script>
<script>document.write('<script src="settings.js?t=' + Date.now() + '"><\/script>');</script>
<script>
// 设置文件缺失或写错时的保护：页面仍可打开，并提示检查 settings.js
if (typeof SCREENS === "undefined") {
  window.SCREENS = []; window.NOTICES = []; window.FORM_URL = ""; window.COLLECT_INTRO = ""; window.COLLECT_RULES = []; window.WALL = []; window.SHOTS = [];
  document.addEventListener("DOMContentLoaded", function () {
    var d = document.createElement("div");
    d.setAttribute("role", "alert");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:200;background:#b3261e;color:#fff;padding:8px 14px;font-size:14px;text-align:center";
    d.textContent = "设置文件 settings.js 读取失败，请检查格式（逗号、引号是否漏掉）";
    document.body.appendChild(d);
  });
}
// 大屏照片简写："照片路径|商场名称"，同一商场写多行只用最上面一行
window.SHOTS = (window.SHOTS || []).map(function (w) {
  if (typeof w !== "string") return w;
  var p = w.split("|").map(function (x) { return x.trim(); });
  return { file: p[0], screen: p[1] || "" };
}).filter(function (x) { return x && x.file && x.screen; });
// 返图墙支持一行一张的简写："照片路径|商场|昵称|说明|封面"
window.WALL = (window.WALL || []).map(function (w) {
  if (typeof w !== "string") return w;
  var p = w.split("|").map(function (x) { return x.trim(); });
  return { file: p[0], screen: p[1] || "", nickname: p[2] || "", caption: p[3] || "", cover: p[4] === "封面" };
}).filter(function (x) { return x && x.file; });
// 同一个照片路径写了多行时，只保留最上面那一行（所以新写的行放最上面会优先）
(function () { var seen = {}; window.WALL = window.WALL.filter(function (x) { if (seen[x.file]) return false; seen[x.file] = 1; return true; }); })();
</script>
<script>

// ===== 工具函式 =====
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function val(v, fallback) { return v ? esc(v) : (fallback || "待定"); }
var MAP_CITY = { "内蒙古": "呼和浩特" };
function mapUrl(s) {
  var city = MAP_CITY[s.city] || s.city;
  return "https://uri.amap.com/search?keyword=" + encodeURIComponent(s.mall) + "&city=" + encodeURIComponent(city) + "&view=map&src=yizhiqiuqiu&coordinate=gaode&callnative=1";
}
function statusOf(s) {
  if (!s.dates.length) return "tbd";
  var now = new Date(), t = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var first = new Date("2026-" + s.dates[0] + "T00:00:00").getTime();
  var last = new Date("2026-" + s.dates[s.dates.length - 1] + "T00:00:00").getTime();
  return t < first ? "soon" : (t > last ? "done" : "live");
}
var STATUS_LABEL = { live: "投放中", soon: "即将投放", done: "已结束", tbd: "日期待定" };
function dayLabel(d) { var p = d.split("-"); return +p[0] + "月" + +p[1] + "日"; }
var state = { tab: "home", sel: 0, q: "", city: "全部", date: "全部" };

// ===== 大屏汇总 =====
var summaryReady = false;
function row(l, v) { return '<p class="r"><b>' + l + "</b><span>" + val(v) + "</span></p>"; }
function selectScreen(i) {
  state.sel = i;
  var s = SCREENS[i];
  Array.prototype.forEach.call(document.querySelectorAll("#m-labels text"), function (t) { t.classList.toggle("sel", t.getAttribute("data-code") === s.prov); });
  var same = [];
  SCREENS.forEach(function (x, n) { if (x.prov === s.prov) same.push(n); });
  document.getElementById("sub").innerHTML = same.length > 1 ? same.map(function (n) {
    return '<button type="button" data-i="' + n + '" aria-pressed="' + (n === i) + '">' + esc(SCREENS[n].city) + "</button>";
  }).join("") : "";
  var cur = document.querySelector("#m-fill use.sel");
  if (cur) cur.classList.remove("sel");
  var u = document.querySelector('#m-fill use[data-code="' + s.prov + '"]');
  if (u) { u.classList.add("sel"); u.parentNode.appendChild(u); }
  document.getElementById("hint").textContent = "点选地图上标出名称的省份，查看大屏";
  document.getElementById("shot").innerHTML = '<div class="pic' + (photoOf(s) ? ' has' : '') + '">' + (photoOf(s)
    ? '<img src="' + esc(photoOf(s)) + '" alt="' + esc(s.mall) + '大屏">'
    : '<div class="ph"><strong>' + esc(s.mall) + "</strong>大屏照片待上传</div>") + "</div>";
  (function () {
    var im = document.querySelector("#shot .pic.has img");
    if (!im) return;
    function fit() { if (im.naturalHeight > im.naturalWidth * 0.95) im.parentNode.classList.add("tall"); }
    if (im.complete) fit(); else im.addEventListener("load", fit);
    im.parentNode.addEventListener("click", function () {
      var d = { "data-src": im.getAttribute("src"), "data-cap": s.city + "｜" + s.mall };
      openBox({ getAttribute: function (k) { return d[k]; } });
    });
  })();
  document.getElementById("info").innerHTML = row("商场名称", s.mall) + row("大屏位置", s.pos) + row("投放日期", s.dateText) + row("投放时间", s.hours) +
    '<p class="r"><b>详细地址</b></p><p class="r-v">' + val(s.addr, "待补充") + "</p>";
}
function renderSummary() {
  if (!summaryReady) {
    SCREENS.forEach(function (s) {
      var u = document.querySelector('#m-fill use[data-code="' + s.prov + '"]');
      if (u) u.classList.add("has");
    });
    summaryReady = true;
  }
  selectScreen(state.sel);
}
function pickProv(code) {
  if (SCREENS[state.sel].prov === code) return;
  for (var i = 0; i < SCREENS.length; i++) {
    if (SCREENS[i].prov === code) { selectScreen(i); return; }
  }
  document.getElementById("hint").textContent = PROV[code] + "暂时没有大屏";
}
document.getElementById("cnmap").addEventListener("click", function (e) {
  var t = e.target.closest(".hit, use.prov");
  if (t) pickProv(t.getAttribute("data-code"));
});
document.getElementById("cnmap").addEventListener("keydown", function (e) {
  var t = e.target.closest(".hit");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickProv(t.getAttribute("data-code")); }
});
document.getElementById("sub").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-i]");
  if (b) selectScreen(+b.getAttribute("data-i"));
});

// ===== 点位查询 =====
var searchBuilt = false;
function options(arr, allLabel) { return '<option value="全部">' + allLabel + "</option>" + arr.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + "</option>"; }).join(""); }
function buildSearch() {
  var days = [];
  SCREENS.forEach(function (s) { s.dates.forEach(function (d) { if (days.indexOf(d) === -1) days.push(d); }); });
  days.sort();
  var dateOpts = '<option value="全部">全部日期</option>' + days.map(function (d) { return '<option value="' + d + '">' + dayLabel(d) + "</option>"; }).join("");
  document.getElementById("view-search").innerHTML =
    '<div class="filters">' +
    '<input id="q" type="search" placeholder="搜索商场名称、城市或地址" autocomplete="off" aria-label="搜索商场名称、城市或地址">' +
    '<label class="fld" for="f-city"><span>城市</span><select id="f-city">' + options(SCREENS.map(function (s) { return s.city; }), "全部城市") + "</select></label>" +
    '<label class="fld" for="f-date"><span>投放日期</span><select id="f-date">' + dateOpts + "</select></label></div>" +
    '<p class="count" id="s-count" aria-live="polite"></p><div class="cards" id="s-list"></div>';
  searchBuilt = true;
}
function fact(l, v, wide) { return '<div' + (wide ? ' class="wide"' : "") + "><dt>" + l + "</dt><dd>" + val(v) + "</dd></div>"; }
function renderSearch() {
  if (!searchBuilt) buildSearch();
  document.getElementById("q").value = state.q;
  document.getElementById("f-city").value = state.city;
  document.getElementById("f-date").value = state.date;
  renderList();
}
function renderList() {
  var q = state.q.trim().toLowerCase();
  var list = SCREENS.filter(function (s) {
    if (state.city !== "全部" && s.city !== state.city) return false;
    if (state.date !== "全部" && s.dates.indexOf(state.date) === -1) return false;
    return !q || (s.city + s.mall + s.addr + s.pos).toLowerCase().indexOf(q) !== -1;
  });
  document.getElementById("s-count").textContent = "找到 " + list.length + " 个点位";
  var out = list.length ? "" : '<div class="empty">没有符合的点位，试试清除关键字或放宽筛选条件。</div>';
  list.forEach(function (s) {
    var st = statusOf(s);
    out += '<article class="card"><div class="card-head"><h3><small>' + esc(s.city) + "</small>" + esc(s.mall) + '</h3><span class="pill ' + st + '">' + STATUS_LABEL[st] + "</span></div>" +
      '<p class="addr">' + val(s.addr, "详细地址待补充") + "</p>" +
      '<dl class="facts">' + fact("大屏位置", s.pos) + fact("投放日期", s.dateText) + fact("投放时间", s.hours) + "</dl>" +
      '<div class="actions"><a class="btn primary" href="' + mapUrl(s) + '" target="_blank" rel="noopener">开启高德地图</a>' +
      (s.addr ? '<button class="btn" type="button" data-copy="' + esc(s.addr) + '">复制地址</button>' : "") + "</div></article>";
  });
  document.getElementById("s-list").innerHTML = out;
}
document.getElementById("view-search").addEventListener("input", function (e) {
  if (e.target.id === "q") { state.q = e.target.value; renderList(); }
});
document.getElementById("view-search").addEventListener("change", function (e) {
  if (e.target.id === "f-city") state.city = e.target.value;
  else if (e.target.id === "f-date") state.date = e.target.value;
  else return;
  renderList();
});
document.getElementById("view-search").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-copy]");
  if (!b) return;
  var text = b.getAttribute("data-copy"), old = b.getAttribute("data-label") || b.textContent;
  b.setAttribute("data-label", old);
  var done = function (ok) { b.textContent = ok ? "已复制" : "请长按选取地址"; setTimeout(function () { b.textContent = old; }, 1800); };
  try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); }
  catch (err) { done(false); }
});

// ===== 页面切换 =====
var TITLES = { summary: "大屏汇总", search: "点位查询", notice: "公告栏", collect: "返图收集", wall: "返图墙" };
var PLACEHOLDERS = {
  notice: ["公告栏还没有内容", "有新公告时会显示在这里。"],
  collect: ["返图收集尚未开放", "开放后可以在这里提交现场返图。"],
  wall: ["返图墙尚未开放", "收集到的返图会在这里展示。"]
};
function show(view, push) {
  if (view !== "home" && !TITLES[view]) view = "home";
  state.tab = view;
  var home = view === "home";
  document.getElementById("home").hidden = !home;
  document.getElementById("inner").hidden = home;
  if (!home) {
    Object.keys(TITLES).forEach(function (t) { document.getElementById("view-" + t).hidden = t !== view; });
    document.getElementById("inner-title").textContent = TITLES[view];
    if (view === "summary") renderSummary();
    else if (view === "search") renderSearch();
    else if (view === "notice") loadNotice();
    else if (view === "collect") renderCollect();
    else if (view === "wall") loadWall();
  }
  if (push) {
    try { history.pushState(null, "", "#" + view); }
    catch (e) { try { location.hash = view; } catch (e2) {} }
  }
  window.scrollTo(0, 0);
}
document.getElementById("home").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-go]");
  if (b) show(b.getAttribute("data-go"), true);
});
document.getElementById("back").addEventListener("click", function () { show("home", true); });
function fromHash() { return (location.hash || "").replace("#", "") || "home"; }
window.addEventListener("popstate", function () { show(fromHash(), false); });
window.addEventListener("hashchange", function () { show(fromHash(), false); });

var covers = {}, shots = {};
// 汇总页照片优先级：返图里标了「封面」的 > screens 里的原本商场照片 > SCREENS 里的 photo
function photoOf(s) { return covers[s.mall] || shots[s.mall] || s.photo || ""; }
// 大屏汇总页的大屏照片：settings.js 的 SHOTS 里写了、且文件真的已上传的才使用
var SHOTS_OK = null;
function shotsReady() {
  if (!SHOTS_OK) SHOTS_OK = Promise.all(SHOTS.map(function (it) {
    return probeFile(it.file).then(function (ok) { it.ok = ok; return it; });
  }));
  return SHOTS_OK;
}
function probeFile(file) {
  return new Promise(function (res) {
    function viaImage() { var im = new Image(); im.onload = function () { res(true); }; im.onerror = function () { res(false); }; im.src = file + "?v=1"; }
    if (!window.fetch) { viaImage(); return; }
    fetch(file + "?v=1", { method: "HEAD", cache: "no-cache" }).then(function (r) { res(r.ok); }, viaImage);
  });
}
function setHTML(id, h) { document.getElementById(id).innerHTML = h; }
// 预设位置全部显示；文件还没上传的格子显示「待上传」
var WALL_OK = null, WALLSHOW = [];
function wallReady() {
  if (!WALL_OK) WALL_OK = Promise.all(WALL.map(function (it) {
    // 只问「这个文件在不在」（HEAD 请求，不下载图片本体），避免一开页就把所有返图完整下载一遍
    function viaImage(res) { var im = new Image(); im.onload = function () { it.ok = true; res(it); }; im.onerror = function () { it.ok = false; res(it); }; im.src = it.file + "?v=1"; }
    return new Promise(function (res) {
      if (!window.fetch) { viaImage(res); return; }
      fetch(it.file + "?v=1", { method: "HEAD", cache: "no-cache" }).then(function (r) { it.ok = r.ok; res(it); }, function () { viaImage(res); });
    });
  }));
  return WALL_OK;
}
function loadCovers() {
  Promise.all([wallReady(), shotsReady()]).then(function (r) {
    covers = {}; shots = {};
    r[0].forEach(function (it) { if (it.ok && it.cover && it.screen && it.file && !isVid(it.file) && !covers[it.screen]) covers[it.screen] = it.file + "?v=1"; });
    r[1].forEach(function (it) { if (it.ok && !shots[it.screen]) shots[it.screen] = it.file + "?v=1"; });
    if (state.tab === "summary") selectScreen(state.sel);
  });
}
function safeLink(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>"; });
}
function loadNotice() {
  var list = NOTICES.slice().sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0); });
  if (!list.length) { setHTML("view-notice", '<div class="empty"><strong>公告栏还没有内容</strong><br>有新公告时会显示在这里。</div>'); return; }
  setHTML("view-notice", '<div class="notes">' + list.map(function (a) {
    return '<article class="note"><h3>' + (a.pinned ? '<span class="pin">置顶</span>' : "") + esc(a.title) + "</h3><time>" + esc(a.date || "") + "</time>" + (a.body ? "<p>" + safeLink(a.body) + "</p>" : "") + "</article>";
  }).join("") + "</div>");
}
function renderCollect() {
  setHTML("view-collect",
    '<a class="go" id="go" href="' + (FORM_URL ? esc(FORM_URL) : "#") + '" target="_blank" rel="noopener"' + (FORM_URL ? "" : ' aria-disabled="true"') + ">📷 " + (FORM_URL ? "前往提交返图" : "返图通道尚未开放") + "</a>" +
    '<section class="guide"><h2>返图说明</h2><p>' + esc(COLLECT_INTRO) + "</p><h3>上传须知</h3><ul>" + COLLECT_RULES.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul>" +
    '<p class="stat" style="margin-top:12px">📊 目前返图墙已有 <b id="wall-n">…</b> 张返图</p></section>');
  wallReady().then(function (l) { var n = document.getElementById("wall-n"); if (n) n.textContent = l.filter(function (x) { return x.ok; }).length; });
}
var wallOff = 0, WALL_PAGE = 30;
function figure(g) {
  var name = esc(g.screen || "未标注商场");
  if (!g.items.length) return '<figure class="todo" aria-label="待上传"><div class="ph">待上传</div><figcaption><b>' + name + '</b></figcaption></figure>';
  var imgs = g.items.map(function (it) {
    return '<div class="sl">' + (isVid(it.file) ? '<video src="' + esc(it.file + "?v=1") + '#t=0.1" muted playsinline preload="metadata"></video><span class="play">▶</span>' : '<img src="' + esc(it.file + "?v=1") + '" alt="返图" loading="lazy" decoding="async">') + "</div>";
  }).join("");
  var multi = g.items.length > 1;
  var dots = multi ? '<div class="dots">' + g.items.map(function (_, k) { return "<i" + (k ? "" : ' class="on"') + "></i>"; }).join("") + "</div>" : "";
  return '<figure class="grp" data-k="' + g.k + '" tabindex="0" role="button"><div class="box"><div class="car">' + imgs + "</div>" + dots + (multi ? '<span class="cnt">' + g.items.length + " 张</span>" : "") + "</div><figcaption><b>" + name + '</b><span class="nk">' + esc(g.items[0].nickname || "匿名") + '</span><span class="sy">' + esc(g.items[0].caption || "") + "</span></figcaption></figure>";
}
function isVid(f) { return /\.(mp4|webm|mov|m4v)$/i.test(f || ""); }
var WALLGROUPS = [];
function groupWall(list) {
  var map = {}, out = [];
  list.forEach(function (it) {
    var key = it.screen || "";
    var g = map[key]; if (!g) { g = map[key] = { screen: key, items: [], k: out.length }; out.push(g); }
    if (it.ok) g.items.push(it);
  });
  return out;
}
function showMore() {
  var part = WALLSHOW.slice(wallOff, wallOff + WALL_PAGE);
  document.getElementById("wall-grid").insertAdjacentHTML("beforeend", part.map(figure).join(""));
  wallOff += part.length;
  document.getElementById("wall-more").innerHTML = wallOff < WALLSHOW.length ? '<button class="more" type="button" id="more-btn">加载更多</button>' : "";
}
function loadWall() {
  setHTML("view-wall", '<p class="count">载入中…</p>');
  wallReady().then(function (list) {
    WALLGROUPS = groupWall(list); WALLSHOW = WALLGROUPS;
    if (!WALLGROUPS.length) { setHTML("view-wall", '<div class="empty"><strong>返图墙还没有位置</strong></div>'); return; }
    wallOff = 0; setHTML("view-wall", '<div class="wall" id="wall-grid"></div><div id="wall-more"></div>'); showMore(); startAuto();
  });
}
function openBox(fig, list, idx) {
  var items = list || [{ src: fig.getAttribute("data-src"), cap: fig.getAttribute("data-cap") }], cur = idx || 0;
  var b = document.createElement("div"); b.className = "lightbox"; b.setAttribute("role", "dialog"); b.setAttribute("aria-label", "放大查看");
  var multi = items.length > 1;
  b.innerHTML = '<button type="button" class="x">关闭</button>' + (multi ? '<button type="button" class="nav prev" aria-label="上一张">‹</button><button type="button" class="nav next" aria-label="下一张">›</button>' : "") + '<div class="m"></div><p></p>';
  function draw() {
    var m = b.querySelector(".m"), it = items[cur];
    m.innerHTML = "";
    var el = document.createElement(it.vid ? "video" : "img");
    if (it.vid) { el.controls = true; el.autoplay = true; el.playsInline = true; el.setAttribute("playsinline", ""); el.loop = true; } else el.alt = "返图大图";
    el.src = it.src; m.appendChild(el); b.querySelector("p").textContent = items[cur].cap + (multi ? "（" + (cur + 1) + "/" + items.length + "）" : ""); }
  function go(d) { cur = (cur + d + items.length) % items.length; draw(); }
  function close() { b.remove(); document.removeEventListener("keydown", key); }
  function key(ev) { if (ev.key === "Escape") close(); else if (multi && ev.key === "ArrowLeft") go(-1); else if (multi && ev.key === "ArrowRight") go(1); }
  b.addEventListener("click", function (ev) {
    if (ev.target.tagName === "VIDEO") return;
    if (ev.target.classList.contains("prev")) { go(-1); return; }
    if (ev.target.classList.contains("next")) { go(1); return; }
    close();
  });
  document.addEventListener("keydown", key); draw();
  document.body.appendChild(b); b.querySelector(".x").focus();
}
function capOf(it) { return (it.screen || "未标注商场") + (it.nickname ? "｜" + it.nickname : "") + (it.caption ? "｜" + it.caption : ""); }
function openGroup(fig) {
  var g = WALLGROUPS[+fig.getAttribute("data-k")]; if (!g || !g.items.length) return;
  var car = fig.querySelector(".car"), idx = car && car.clientWidth ? Math.round(car.scrollLeft / car.clientWidth) : 0;
  openBox(null, g.items.map(function (it) { return { src: it.file + "?v=1", vid: isVid(it.file), cap: capOf(it) }; }), idx);
}
// 轮播：每 4 秒自动翻页，手指也可左右滑动
var AUTO = null, VIS = null, TICK = 0;
function startAuto() {
  if (AUTO) clearInterval(AUTO);
  if (VIS) VIS.disconnect();
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cars = [].slice.call(document.querySelectorAll("#wall-grid .car")).filter(function (c) { return c.children.length > 1; });
  if (!cars.length) return;
  if (window.IntersectionObserver) {
    VIS = new IntersectionObserver(function (es) { es.forEach(function (e) { e.target.setAttribute("data-vis", e.isIntersecting ? "1" : ""); }); }, { threshold: 0.4 });
    cars.forEach(function (c) { VIS.observe(c); });
  } else cars.forEach(function (c) { c.setAttribute("data-vis", "1"); });
  // 每秒只翻一个可见的轮播，错开动画，减轻手机负担；每个轮播约 4~5 秒翻一次
  AUTO = setInterval(function () {
    if (!document.getElementById("wall-grid") || document.querySelector(".lightbox") || document.hidden) return;
    var vis = cars.filter(function (c) { return c.getAttribute("data-vis") === "1" && c.clientWidth; });
    if (!vis.length) return;
    var c = vis[TICK++ % vis.length], n = c.children.length;
    var i = (Math.round(c.scrollLeft / c.clientWidth) + 1) % n;
    c.scrollTo({ left: i * c.clientWidth, behavior: "smooth" });
  }, 1200);
}
document.getElementById("view-wall").addEventListener("scroll", function (e) {
  var c = e.target; if (!c.classList || !c.classList.contains("car") || !c.clientWidth) return;
  var i = Math.round(c.scrollLeft / c.clientWidth), d = c.parentNode.querySelectorAll(".dots i");
  for (var k = 0; k < d.length; k++) d[k].className = k === i ? "on" : "";
  var fig = c.closest("figure"), g = WALLGROUPS[+fig.getAttribute("data-k")], it = g && g.items[i];
  if (it) { fig.querySelector(".nk").textContent = it.nickname || "匿名"; fig.querySelector(".sy").textContent = it.caption || ""; }
}, true);
document.getElementById("view-wall").addEventListener("click", function (e) {
  if (e.target.id === "more-btn") { showMore(); return; }
  var f = e.target.closest("figure"); if (f && !f.classList.contains("todo")) openGroup(f);
});
document.getElementById("view-wall").addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return; var f = e.target.closest("figure"); if (f && !f.classList.contains("todo")) { e.preventDefault(); openGroup(f); }
});

show(fromHash(), false);
loadCovers();
// ===== 开场画面 =====
(function () {
  var el = document.getElementById("splash");
  if (!el) return;
  var h = (location.hash || "").replace("#", "");
  if (h && h !== "home") { el.remove(); return; }
  document.documentElement.style.overflow = "hidden";
  var gone = false, timer;
  function leave() {
    if (gone) return; gone = true; clearTimeout(timer);
    document.documentElement.style.overflow = "";
    el.classList.add("out");
    setTimeout(function () { el.remove(); }, 600);
  }
  el.addEventListener("click", leave);
  timer = setTimeout(leave, 4000);
})();

</script>
